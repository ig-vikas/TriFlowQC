[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "TriFlowQC"
version = "1.0.0"
description = "Qutrit quantum neural network framework with real IBM Quantum hardware support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "TriFlowQC Contributors"}
]
keywords = ["quantum", "qutrit", "neural-network", "quantum-computing", "IBM-Quantum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
ibm = ["qiskit>=1.0", "qiskit-ibm-runtime>=0.20", "qiskit-aer>=0.13"]
qutip = ["qutip>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-timeout",
    "pytest-html",
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.20",
    "qiskit-aer>=0.13",
    "qutip>=5.0",
    "scikit-learn>=1.3",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["triflowqc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires IBM Quantum hardware",
    "slow: slow running tests",
    "qiskit: requires qiskit",
    "qutip: requires qutip",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["triflowqc"]
omit = ["tests/*", "examples/*", "validation/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
