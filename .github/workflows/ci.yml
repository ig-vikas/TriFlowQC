name: TriFlowQC CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Lint with flake8
      run: |
        flake8 triflowqc/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 triflowqc/ --count --exit-zero --max-complexity=15 --max-line-length=100 --statistics

    - name: Type check with mypy
      run: |
        mypy triflowqc/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short -x

    - name: Run math validation tests
      run: |
        pytest tests/math_validation/ -v --tb=short

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short -x
      timeout-minutes: 30

    - name: Run validation scripts
      run: |
        python validation/validate_gates.py
        python validation/validate_encoding.py
        python validation/validate_training.py
      timeout-minutes: 15

    - name: Generate coverage report
      run: |
        pytest tests/unit/ tests/math_validation/ --cov=triflowqc --cov-report=xml --cov-report=html -q

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

    - name: Upload coverage artifact
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run benchmarks
      run: |
        pytest tests/benchmarks/ -v --tb=short -m benchmark
      timeout-minutes: 30

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
